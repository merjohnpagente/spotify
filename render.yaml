# Render Blueprint - deploys the API free on https://spotify-fy-api.onrender.com
# Import: Render Dashboard > New > Blueprint > select this repo.
# You will be asked to paste MONGODB_URI (from MongoDB Atlas > Connect > Drivers).

services:
  - type: web
    name: spotify-fy-api
    runtime: node
    plan: free
    rootDir: backend
    # Download the LATEST yt-dlp Linux binary at build time - YouTube
    # extraction breaks quickly with stale yt-dlp versions.
    buildCommand: npm ci && mkdir -p bin && (curl -fsSL -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux || echo "yt-dlp download failed, falling back to module binary") && chmod +x bin/yt-dlp 2>/dev/null || true
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: YT_DLP_PATH
        value: /opt/render/project/src/backend/bin/yt-dlp
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 1h
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      # Allow GitHub Pages + local dev (CORS comma-list, see backend/src/app.js)
      - key: FRONTEND_URL
        value: https://merjohnpagente.github.io/spotify,https://merjohnpagente.github.io
      # Faster playback — avoid Render killing slow yt-dlp
      - key: REQUEST_TIMEOUT
        value: 90000
      # Firebase ID-token verification for Google sign-in (public certs, no keys needed).
      - key: FIREBASE_PROJECT_ID
        value: spotify-ee119
      # YouTube bot-checks Render's datacenter IP on watch-page extraction
      # ("Sign in to confirm you're not a bot"). Paste a Netscape cookies.txt
      # exported from a logged-in browser to lift it — see backend/.env.example.
      # Without it, /api/debug/ytdlp fails on prod (app still plays on-device).
      - key: YOUTUBE_COOKIES
        sync: false
