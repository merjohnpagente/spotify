name: spotify_fy
description: "A Flutter app that replicates Spotify UI with YouTube backend for ad-free music streaming."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.10
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  url_launcher: ^6.2.6
  provider: ^6.1.2
  http: ^1.2.0
  audioplayers: ^6.0.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  youtube_explode_dart: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/spotify.png"
  windows:
    generate: true
    image_path: "assets/images/spotify.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/spotify.png"
  linux:
    generate: true
    image_path: "assets/images/spotify.png"
  image_path: "assets/images/spotify.png"
  adaptive_icon_background: "#191414"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  image: assets/images/splashh.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#000000"
    image: assets/images/splashh.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/